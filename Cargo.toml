[workspace]

[package]
name = "founder-os-sovereign-mcp"
version = "0.2.0"
edition = "2021"
description = "Founder OS Sovereign MCP Server — cryptographic gateway for verified workflow execution"

[dependencies]
num-rational = "0.4"
thiserror = "1.0"
axum = "0.7"
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
bcs = "0.1"
hex = "0.4"
sha2 = "0.10"

# Poseidon-2 over BN254 scalar field (Horizen Labs t=3 params, KAT-validated)
poseidon2 = { version = "0.0.1", default-features = false }
ark-bn254 = { version = "0.6", default-features = false, features = ["scalar_field"] }
ark-ff = { version = "0.6", default-features = false }