
<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>ΞchoBraid — Learning that honors your signal</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Lexend:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <script>
      tailwind.config = {
        theme: {
          extend: {
            fontFamily: {
              serif: ['"Lexend"', 'sans-serif'], // Replacing Playfair with Lexend for maximum accessibility
              sans: ['"Lexend"', 'sans-serif'],
            },
            colors: {
              brand: {
                accent: '#7FA99B', // Calm sage accent
                base: '#F4F4F5',   // Monochrome base
                dark: '#27272A',
                light: '#FAFAFA',
              }
            },
            borderRadius: {
              '2xl': '1.5rem',
            },
            animation: {
              'breath': 'breath 12s ease-in-out infinite', // Slower breathing
              'fade-in': 'fadeIn 2s ease-out forwards',   // Slower fade
            },
            keyframes: {
              breath: {
                '0%, 100%': { transform: 'scale(1)', opacity: '0.2' },
                '50%': { transform: 'scale(1.1)', opacity: '0.4' },
              },
              fadeIn: {
                '0%': { opacity: '0' },
                '100%': { opacity: '1' },
              },
            }
          }
        }
      }
    </script>
    <style>
      :root {
        --bg: #FAFAFA;
        --text: #27272A;
      }
      html.dark {
        --bg: #09090b;
        --text: #d6d3d1;
      }
      html.dim {
        --bg: #f5f2ed;
        --text: #1a1a1a;
      }
      html {
        scroll-behavior: smooth;
        scroll-padding-top: 80px;
        /* Dyslexic-friendly global adjustments */
        font-size: 18px; /* Slightly larger base font */
      }
      body {
        background-color: var(--bg);
        color: var(--text);
        line-height: 1.6; /* Increased line height */
        letter-spacing: 0.03em; /* Slightly increased letter spacing */
        transition: background-color 0.5s ease, color 0.5s ease;
      }
      h1, h2, h3, h4, h5, h6 {
        letter-spacing: -0.01em; /* Tighten headers slightly but keep readable */
        line-height: 1.3;
      }
      p {
        max-width: 65ch; /* Optimal line length for readability */
      }
      .low-stimulus-shadow {
        box-shadow: 0 2px 10px -2px rgba(0, 0, 0, 0.03);
      }
    </style>

  }
}
</script>
