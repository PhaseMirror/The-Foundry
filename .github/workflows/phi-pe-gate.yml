name: Phi-Psi-Epsilon Codec Gate

# Every change touching the phi-pe codec must keep: valid example passing,
# three reject fixtures failing, three charts sharing one kernelHash, and the
# pinned codecHash recomputable from a clean checkout (CANON-JSON-SHA256-v1).
on:
  push:
    branches: [main, master]
    paths:
      - "docs/specs/phi-pe.codec.json"
      - "docs/specs/phi-pe.charts/**"
      - "docs/specs/phi-pe.fixtures/**"
      - "scripts/hash_phi_pe.py"
      - ".github/workflows/phi-pe-gate.yml"
  pull_request:
    paths:
      - "docs/specs/phi-pe.codec.json"
      - "docs/specs/phi-pe.charts/**"
      - "docs/specs/phi-pe.fixtures/**"
      - "scripts/hash_phi_pe.py"
      - ".github/workflows/phi-pe-gate.yml"
  workflow_dispatch:

jobs:
  phi-pe-gate:
    name: codec hash + schema gate
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install jsonschema
        run: python -m pip install --quiet jsonschema

      - name: Run phi-pe gate
        run: python3 scripts/hash_phi_pe.py --strict