[workspace]

[package]
name = "founder-os-sovereign-mcp"
version = "0.3.0"
edition = "2021"
description = "Founder OS Sovereign MCP Server — cryptographic gateway for verified workflow execution (fail-closed CRMF envelopes, PWEH lineage, UCC contractivity)"
license = "LicenseRef-Lawful"
keywords = ["mcp", "governance", "crmf", "pweh", "ucc", "founder-os"]
categories = ["cryptography", "command-line-utilities"]

[features]
default = []
# Enables Kani symbolic verification harnesses (`cargo kani -p founder-os-sovereign-mcp`).
kani = []

[dependencies]
num-rational = "0.4"
thiserror = "1.0"
axum = "0.7"
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
bcs = "0.1"
hex = "0.4"
sha2 = "0.10"

# Poseidon-2 over BN254 scalar field (Horizen Labs t=3 params, KAT-validated)
poseidon2 = { version = "0.0.1", default-features = false }
ark-bn254 = { version = "0.6", default-features = false, features = ["scalar_field"] }
ark-ff = { version = "0.6", default-features = false }

[lints.rust]
# `cfg(kani)` is a real condition provided by the `kani` Cargo feature.
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(kani)'] }