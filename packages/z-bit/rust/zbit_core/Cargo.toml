[package]
name = "zbit_core"
version = "0.1.0"
edition = "2021"

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
log = "0.4"
sha2 = "0.10"
hex = "0.4"
thiserror = { version = "2.0", optional = true }

[features]
default = ["std"]
std = ["thiserror"]
kani = []

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(kani)'] }
