[package]
name = "mirror-dissonance-cli"
version = "1.0.0-alpha"
edition = "2021"

[dependencies]
clap = { version = "4.0", features = ["derive"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
serde_yaml = "0.9"
tokio = { version = "1.0", features = ["full"] }
anyhow = "1.0"
thiserror = "2.0"
sha2 = "0.10"
hex = "0.4"
chrono = { version = "0.4", features = ["serde"] }
walkdir = "2.4"
hmac = "0.12"
sha3 = "0.10"
uuid = { version = "1.0", features = ["v4", "serde"] }
regex = "1.10"

[workspace]

