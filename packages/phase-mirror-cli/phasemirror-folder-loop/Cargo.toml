[package]
name = "phasemirror-folder-loop"
version = "1.0.0-alpha"
edition = "2021"

[dependencies]
clap = { version = "4.0", features = ["derive"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
anyhow = "1.0"
thiserror = "2.0"
sha2 = "0.10"
hex = "0.4"
chrono = { version = "0.4", features = ["serde"] }
walkdir = "2.4"

[dev-dependencies]
tempfile = "3.10"

[workspace]
