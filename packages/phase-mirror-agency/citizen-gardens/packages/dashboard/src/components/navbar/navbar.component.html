
<nav class="fixed top-0 left-0 right-0 z-50 bg-[rgba(13,15,20,0.8)] backdrop-blur-[20px] border-b border-[rgba(255,255,255,0.06)]">
  <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
    <div class="flex items-center justify-between h-20">
      
      <!-- Logo -->
      <div class="flex-shrink-0">
        <a href="#" class="flex items-center group">
          <span class="text-3xl font-bold font-heading text-[#2DD4BF] group-hover:text-white transition-colors duration-300 relative">
            C<span class="absolute left-[8px] top-[1px] text-3xl font-bold font-heading text-[#2DD4BF] group-hover:text-[#8B5CF6] transition-colors duration-300">G</span>
            <span class="absolute inset-0 transition-all duration-300 rounded-full opacity-0 group-hover:opacity-100 -z-10" style="box-shadow: 0 0 30px rgba(139, 92, 246, 0.2);"></span>
          </span>
        </a>
      </div>

      <!-- Desktop Navigation -->
      <div class="hidden md:block">
        <div class="ml-10 flex items-baseline space-x-6">
          @for (item of navItems; track item) {
            <a (click)="setActiveItem(item)"
              class="relative cursor-pointer px-3 py-2 rounded-md text-sm font-medium transition-colors duration-300"
              [class]="activeItem() === item ? 'text-[#F0F0F5]' : 'text-[#8B8FA3] hover:text-[#F0F0F5]'">
              {{ item }}
              @if (activeItem() === item) {
                <span class="absolute bottom-0 left-0 right-0 h-0.5 bg-[#2DD4BF] rounded-full motion-safe:transition-all motion-safe:duration-300"></span>
              }
            </a>
          }
        </div>
      </div>

      <!-- Right side actions -->
      <div class="hidden md:flex items-center space-x-5">
        <button class="relative text-[#8B8FA3] hover:text-white transition-colors">
          <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9"></path><path d="M13.73 21a2 2 0 0 1-3.46 0"></path></svg>
          <span class="absolute top-0 right-0 block h-2.5 w-2.5 rounded-full bg-[#2DD4BF] ring-2 ring-[#0D0F14]"></span>
        </button>
        <div class="h-8 w-8 rounded-full bg-cover bg-center border-2 border-[rgba(255,255,255,0.1)]" style="background-image: url('https://picsum.photos/id/237/100/100')"></div>
        <button class="px-4 py-2 text-sm font-semibold text-[#0D0F14] bg-[#2DD4BF] rounded-full hover:shadow-[0_0_20px_rgba(45,212,191,0.3)] transition-shadow duration-300">
          Join the Garden
        </button>
      </div>

      <!-- Mobile menu button -->
      <div class="-mr-2 flex md:hidden">
        <button (click)="toggleMobileMenu()" type="button" class="inline-flex items-center justify-center p-2 rounded-md text-[#8B8FA3] hover:text-white focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-offset-gray-800 focus:ring-white" aria-controls="mobile-menu" aria-expanded="false">
          <span class="sr-only">Open main menu</span>
          @if (!isMobileMenuOpen()) {
            <svg class="block h-6 w-6" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor" aria-hidden="true">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 12h16M4 18h16" />
            </svg>
          } @else {
            <svg class="block h-6 w-6" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor" aria-hidden="true">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12" />
            </svg>
          }
        </button>
      </div>

    </div>
  </div>

  <!-- Mobile menu, show/hide based on menu state. -->
  @if(isMobileMenuOpen()) {
    <div class="md:hidden" id="mobile-menu">
      <div class="px-2 pt-2 pb-3 space-y-1 sm:px-3">
        @for (item of navItems; track item) {
          <a (click)="setActiveItem(item)"
            class="block px-3 py-2 rounded-md text-base font-medium"
            [class]="activeItem() === item ? 'text-white bg-[rgba(45,212,191,0.1)]' : 'text-[#8B8FA3] hover:text-white hover:bg-[rgba(255,255,255,0.05)]'">
            {{ item }}
          </a>
        }
      </div>
    </div>
  }
</nav>
