version: "3.9"

services:
  agency-server:
    build:
      context: ./packages/phase-mirror-agency/agency-server
      dockerfile: Dockerfile.agency
    image: phase-mirror/agency-server:local
    ports:
      - "8082:8082"
    volumes:
      - ./packages/phase-mirror-agency/agency-server/var/archivum:/app/var/archivum
      - ./packages/phase-mirror-agency/ui/dist:/app/ui-dist:ro
    environment:
      - NODE_ENV=production
      - PORT=8082
      - ARCHIVUM_WAL=/app/var/archivum/ledger.jsonl
      - BINARIES_DIR=/app/bin
      - CORS_ORIGINS=http://localhost:5173,http://localhost:3000
    depends_on:
      - q-calculator-rest

  q-calculator-rest:
    build:
      context: ./Legacy/q-calculator
      dockerfile: Dockerfile.calculator
    image: phase-mirror/q-calculator:local
    ports:
      - "7070:7070"
    volumes:
      - ./Legacy/q-calculator/.qari:/data
    environment:
      - QARI_API_VERSION_STRICT=1
      - QARI_ARCHIVUM_STORE=/data/archivum.json

  ui:
    build:
      context: ./packages/phase-mirror-agency/ui
      dockerfile: Dockerfile.ui
    image: phase-mirror/ui:local
    ports:
      - "5173:5173"
    environment:
      - VITE_API_BASE=http://localhost:8082/v1

networks:
  default:
    name: phase-mirror-meta
