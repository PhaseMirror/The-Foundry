version: "1.0"
policy_name: "Multiplicity Foundation IP & Governance Retention"
sedona_references:
  - principle: "Sedona Principle 2"
    note: "Proportionality: Core IP (PIRTM, Lambda-m) is unique and irreplaceable."
  - principle: "Sedona Principle 5"
    note: "Duty to preserve arises immediately for CHL Labs separation matters."

rules:
  - id: "pirtm-core-retention"
    description: "Permanent retention for PIRTM source code and formal proofs."
    scope:
      systems: ["git-repo", "lean-core"]
      esi_types: ["SourceCode", "FormalProof"]
    when:
      litigation_hold_active: true
      relevance_band: ["Core"]
    action:
      retain_for_days: "infinite"
      delete_after: false
    sedona:
      principles: ["Principle 2", "Principle 5"]
      rationale: "PIRTM is the foundation of the sovereign stack; loss constitutes irreparable spoliation."

  - id: "lambda-trace-governance"
    description: "Extended retention for governance traces."
    scope:
      systems: ["lambda-trace-service", "crmf-logs"]
      esi_types: ["ProvenanceTrace", "GovernanceLog"]
    when:
      litigation_hold_active: false
      relevance_band: ["Important"]
    action:
      retain_for_days: 2555 # 7 years
      delete_after: true
    sedona:
      principles: ["Principle 5"]
      rationale: "Governance traces provide the audit trail for Phase Mirror invariant enforcement."

  - id: "chl-separation-hold"
    description: "Litigation hold for all CHL Labs correspondence."
    scope:
      systems: ["exchange", "legal-dms"]
      esi_types: ["Email", "Contract", "MNDA"]
    when:
      litigation_hold_active: true
      relevance_band: ["Core"]
    action:
      retain_for_days: "infinite"
      delete_after: false
    sedona:
      principles: ["Principle 5"]
      rationale: "Active dispute regarding CHL Labs separation and IP transfer requires immediate hold."
