[package]
name = "legalese-scopist"
version = "1.0.0-alpha"
edition = "2021"
description = "A tool for enforcing truth-locks and variable integrity in legal templates."

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_yaml = "0.9"
regex = "1.10"
anyhow = "1.0"
thiserror = "1.0"
nom = "7.1"
uuid = { version = "1.7", features = ["v4", "serde", "js"] }
chrono = { version = "0.4", features = ["serde"] }
serde_json = "1.0"
num-bigint = { version = "0.4", features = ["serde"] }
wasm-bindgen = "0.2"
serde-wasm-bindgen = "0.6"
getrandom = { version = "0.2", features = ["js"] }

[lib]
crate-type = ["cdylib", "rlib"]
[workspace]
