schema_version: "1.0"
server_name: "multiplicity-unified-mcp"
governance_version: "v0.1.0"
registry_mode: "wave-3"

tools:
  # --- Governance Domain ---
  - name: "get_governance_adr"
    module: "mcp_server.domains.governance.tools"
    callable: "get_governance_adr"
    description: "Fetch a specific ADR by ID from PhaseMirror-HQ."
    inputs: ["adr_id"]

  - name: "list_governance_adrs"
    module: "mcp_server.domains.governance.tools"
    callable: "list_governance_adrs"
    description: "List all active ADRs with status in the governance core."
    inputs: []

  - name: "query_constitution"
    module: "mcp_server.domains.governance.tools"
    callable: "query_constitution"
    description: "Query the foundational provisions of the Ξ-Constitution."
    inputs: []

  # --- PIRTM Domain ---
  - name: "run_pirtm_call"
    module: "mcp_server.domains.pirtm.tools"
    callable: "run_pirtm_call"
    description: "Execute a Prime-Indexed Recurrence Tensor Machine computation."
    inputs: ["input_expr"]

  # --- agiOS Domain ---
  - name: "agios_get_state"
    module: "mcp_server.domains.agios.tools"
    callable: "agios_get_state"
    description: "Query the current runtime state of agiOS."
    inputs: []

  - name: "agios_constitution_check"
    module: "mcp_server.domains.agios.tools"
    callable: "agios_constitution_check"
    description: "Verify if a proposed action aligns with the agiOS constitution."
    inputs: ["action"]

  # --- Lever Management (Unified) ---
  - name: "execute_lever"
    module: "mcp_server.domains.daemon.tools"
    callable: "execute_lever"
    description: "Execute a task-based lever (e.g. rebuild index, verify math) across the ecosystem."
    inputs: ["lever_id", "scope?"]
