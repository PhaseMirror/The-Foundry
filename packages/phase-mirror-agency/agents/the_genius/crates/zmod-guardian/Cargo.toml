[package]
name = "zmod-guardian"
version = "1.0.0-alpha"
edition = "2021"

[dependencies]
ndarray = { version = "0.15", features = ["serde"] }
ndarray-linalg = "0.16" # For spectral radius/eigenvalue calculation
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "1.0"
anyhow = "1.0"
zmod-substrate = { path = "../zmod-substrate" }
