[package]
name = "phase-mirror-edge"
version = "0.1.0"
edition = "2021"
rust-version = "1.85"
authors = ["Phase Mirror Contributors"]
license = "MIT OR Apache-2.0"
description = "no_std Phase Mirror L0 kernel for ESP32 bare-metal edge"

[dependencies]
heapless = { version = "0.8", default-features = false }
crc = { version = "3.0", default-features = false }
phase-mirror-surface = { path = "../phase-mirror-surface", optional = true }

[features]
default = []
std = ["phase-mirror-surface"]
