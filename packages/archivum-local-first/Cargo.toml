[package]
name = "archivum-local-first"
version = "0.1.0"
edition = "2021"
rust-version = "1.85"
authors = ["Phase Mirror Contributors"]
license = "MIT OR Apache-2.0"
description = "Local-first, CRDT-mergeable, Ed25519-signed append-only Archivum log"

[dependencies]
phase-mirror-surface = { path = "../phase-mirror-surface" }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "2.0"
ed25519-dalek = { version = "2.1", features = ["rand_core", "pkcs8"] }
rand = "0.8"
uuid = { version = "1.11", features = ["v4", "serde"] }
sha2 = "0.11"

[dev-dependencies]
tempfile = "3.10"
