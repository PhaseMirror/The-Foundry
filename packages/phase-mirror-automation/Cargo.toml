[package]
name = "phase-mirror-automation"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
authors = ["Phase Mirror Contributors"]
license = "MIT OR Apache-2.0"
repository = "https://github.com/Multiplicity-Foundation/phase-mirror"
homepage = "https://phase-mirror.ai"
description = "Self-governing automation crate for Phase Mirror development, verified by Kani"

[dependencies]
phase-mirror-gpt = { path = "../phase-mirror-gpt" }
tokio = { version = "1.0", features = ["full"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"
hex = "0.4"
anyhow = "1.0"
clap = { version = "4", features = ["derive", "env"] }
tracing = "0.1"
tracing-subscriber = "0.3"
notify = "6.1"
uuid = { version = "1.0", features = ["v4"] }
chrono = "0.4"

[dev-dependencies]
tempfile = "3.10"
