[package]
name = "phase-mirror-extension-host"
version = "0.1.0"
edition = "2021"
rust-version = "1.85"
authors = ["Phase Mirror Contributors"]
license = "MIT OR Apache-2.0"
description = "Chromium + VS Code extension host bindings for Phase Mirror"

[dependencies]
phase-mirror-surface = { path = "../phase-mirror-surface" }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "2.0"
uuid = { version = "1.11", features = ["v4", "serde"] }

[target.'cfg(target_arch = "wasm32")'.dependencies]
wasm-bindgen = { version = "0.2", optional = true }
web-sys = { version = "0.3", features = [
    "Window",
    "Document",
    "Storage",
    "console",
], optional = true }

[features]
default = ["std"]
std = []
wasm = ["wasm-bindgen", "web-sys"]
