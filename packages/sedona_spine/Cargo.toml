[package]
name = "sedona_spine"
version = "0.1.0"
edition = "2021"
description = "Mandatory zero-drift ESI retention, litigation hold, and spoliation risk kernel"

[dependencies]
serde = { version = "1.0", features = ["derive"], optional = true }
serde_json = { version = "1.0", optional = true }
sha2 = { version = "0.10", optional = true }
hex = { version = "0.4", optional = true }

[features]
default = ["std"]
std = ["serde", "serde_json", "sha2", "hex"]
