[package]
name = "goldilocks"
version = "1.0.0-alpha"
edition = "2021"

[features]
# Enable Kani verification harnesses
kani = []

[dependencies]
serde = { version = "1.0", features = ["derive"] }
once_cell = "1.19.0"
serde_json = "1.0"
thiserror = "2.0.18"

[dev-dependencies]
rand = "0.8"
criterion = "0.5"

[[bench]]
name = "field_ops"
harness = false

# Standalone workspace boundary.
#
# This crate lives under the monorepo root `Cargo.toml`, which declares
# `[workspace]` without listing this package as a member. Cargo then reports
# "current package believes it's in a workspace when it's not" and refuses to
# build. An empty `[workspace]` table opts the crate out, matching sibling
# `pirtm-engine`.
[workspace]
